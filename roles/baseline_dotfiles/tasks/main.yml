############################################################
# Neovim config — only if present
############################################################

- name: Check if role nvim init.lua exists
  stat:
    path: "{{ role_path }}/files/nvim/init.lua"
  register: role_nvim_init

- name: Ensure ~/.config/nvim exists
  file:
    path: "{{ dotfiles_home }}/.config/nvim"
    state: directory
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0755"
  when: role_nvim_init.stat.exists
  become: true

- name: Install Neovim init.lua
  copy:
    src: nvim/init.lua
    dest: "{{ dotfiles_home }}/.config/nvim/init.lua"
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0644"
  when: role_nvim_init.stat.exists
  become: true
  notify: Sync Neovim plugins

- name: Deploy Neovim config tree with safe perms
  command:
    argv:
      - rsync
      - -a
      - --delete
      - --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r
      - "--chown={{ dotfiles_user }}:{{ dotfiles_user }}"
      - "{{ role_path }}/files/nvim/"
      - "{{ dotfiles_home }}/.config/nvim/"
  become: true

- name: Install Neovim plugins (lazy.nvim)
  become: false
  shell: |
    nvim --headless "+Lazy! sync" +qa
  args:
    creates: "{{ dotfiles_home }}/.local/share/nvim/lazy"

############################################################
# Mason
############################################################
- name: Run Mason tool installer
  become: false
  shell: |
    nvim --headless "+MasonToolsInstall" +qa
  args:
    creates: "{{ dotfiles_home }}/.local/share/nvim/mason"
############################################################
# Sway
############################################################

- name: Check if sway config exists
  stat:
    path: "{{ role_path }}/files/config/sway/config"
  register: role_sway

- name: Install sway config
  copy:
    src: config/sway/config
    dest: "{{ dotfiles_home }}/.config/sway/config"
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0644"
  when: role_sway.stat.exists
  become: true

############################################################
# Waybar
############################################################

- name: Check if waybar config exists
  stat:
    path: "{{ role_path }}/files/config/waybar/config.jsonc"
  register: role_waybar_cfg

- name: Install waybar config
  copy:
    src: config/waybar/config.jsonc
    dest: "{{ dotfiles_home }}/.config/waybar/config.jsonc"
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0644"
  when: role_waybar_cfg.stat.exists
  become: true

- name: Check if waybar style exists
  stat:
    path: "{{ role_path }}/files/config/waybar/style.css"
  register: role_waybar_style

- name: Install waybar style
  copy:
    src: config/waybar/style.css
    dest: "{{ dotfiles_home }}/.config/waybar/style.css"
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0644"
  when: role_waybar_style.stat.exists
  become: true

############################################################
# Zsh
############################################################

- name: Ensure default shell is zsh for user
  user:
    name: "{{ dotfiles_user }}"
    shell: /bin/zsh
  become: true

- name: Check if role zshrc exists
  stat:
    path: "{{ role_path }}/files/zsh/.zshrc"
  register: role_zshrc

- name: Install .zshrc
  copy:
    src: zsh/.zshrc
    dest: "{{ dotfiles_home }}/.zshrc"
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0644"
  when: role_zshrc.stat.exists
  become: true

- name: Ensure ~/.zshrc.d exists (snippet loader directory)
  file:
    path: "{{ dotfiles_home }}/.zshrc.d"
    state: directory
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0755"
  become: true

############################################################
# Alacritty
############################################################

- name: Check if alacritty config exists in role
  stat:
    path: "{{ role_path }}/files/config/alacritty/alacritty.toml"
  register: role_alacritty

- name: Install alacritty config
  copy:
    src: config/alacritty/alacritty.toml
    dest: "{{ dotfiles_home }}/.config/alacritty/alacritty.toml"
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0644"
  when: role_alacritty.stat.exists
  become: true

############################################################
# Private overlay repo (optional) + apply (optional)
############################################################

- name: Clone private overlay repo (optional)
  git:
    repo: "{{ private_overlay_repo }}"
    dest: "{{ private_overlay_dest }}"
    version: "{{ private_overlay_branch | default('main') }}"
    update: true
  become: true
  become_user: "{{ dotfiles_user }}"
  when: private_overlay_repo is defined and private_overlay_repo | length > 0
  ignore_errors: true

# Apply overlay as root (so it can write anywhere) but ensure final ownership is user.
- name: Apply private overlay (optional)
  command: >
    rsync -a
    --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r
    --chown={{ dotfiles_user }}:{{ dotfiles_user }}
    "{{ private_overlay_dest }}/" "{{ dotfiles_home }}/"
  become: true
  when: private_overlay_repo is defined and private_overlay_repo | length > 0
  ignore_errors: true
