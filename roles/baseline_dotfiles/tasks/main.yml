---
# roles/baseline_dotfiles/tasks/main.yml

# ------------------------------------------------------------
# Dotfiles role: deploy safe dotfiles into {{ dotfiles_home }}
# Privilege model:
#   - run privileged file writes with become:true (so we can set owner/mode)
#   - run git clones inside home with become_user to avoid root-owned files
#   - avoid become where not needed (stat, logic)
# ------------------------------------------------------------

# Uncomment if you are NOT defining these elsewhere.
#- name: Set dotfiles home/user (defaults)
#  set_fact:
#    dotfiles_home: "/home/user1"
#    dotfiles_user: "user1"

############################################################
# Ensure base directories exist
############################################################

- name: Ensure base directories exist (~/.config, ~/.ssh, ~/.local/share)
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ dotfiles_home }}/.config",            mode: "0755" }
    - { path: "{{ dotfiles_home }}/.ssh",               mode: "0700" }
    - { path: "{{ dotfiles_home }}/.local",             mode: "0755" }
    - { path: "{{ dotfiles_home }}/.local/share",       mode: "0755" }
    - { path: "{{ dotfiles_home }}/.local/share/nvim",  mode: "0755" }
  become: true

- name: Ensure app config directories exist
  file:
    path: "{{ dotfiles_home }}/.config/{{ item }}"
    state: directory
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0755"
  loop:
    - alacritty
    - git
    - nvim
    - sway
    - waybar
  become: true

############################################################
# Git config (XDG style) — templated
############################################################

- name: Check if role git template exists
  stat:
    path: "{{ role_path }}/templates/config/git/config.j2"
  register: role_git_tpl

- name: Install git config (templated)
  template:
    src: config/git/config.j2
    dest: "{{ dotfiles_home }}/.config/git/config"
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0644"
  when: role_git_tpl.stat.exists
  become: true

