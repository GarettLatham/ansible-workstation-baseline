- name: Ensure tmux is installed
  ansible.builtin.dnf:
    name: tmux
    state: present
  become: true

- name: Ensure ~/.tmux/plugins exists
  ansible.builtin.file:
    path: "{{ dotfiles_home }}/.tmux/plugins"
    state: directory
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0755"
  become: true

- name: Install TPM (tmux plugin manager)
  ansible.builtin.git:
    repo: "https://github.com/tmux-plugins/tpm"
    dest: "{{ dotfiles_home }}/.tmux/plugins/tpm"
    version: "master"
    update: true
  become: true
  become_user: "{{ dotfiles_user }}"

- name: Install ~/.tmux.conf
  ansible.builtin.copy:
    src: "tmux/.tmux.conf"
    dest: "{{ dotfiles_home }}/.tmux.conf"
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0644"
  become: true

- name: Install tmux plugins (non-interactive)
  ansible.builtin.command: "{{ dotfiles_home }}/.tmux/plugins/tpm/bin/install_plugins"
  become: true
  become_user: "{{ dotfiles_user }}"
  changed_when: false
  failed_when: false

- name: Reload tmux config if tmux server is running
  ansible.builtin.shell: |
    tmux -L default has-session 2>/dev/null && tmux source-file "{{ dotfiles_home }}/.tmux.conf" || true
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ dotfiles_user }}"
  changed_when: false
############################################################
# SSH config — safe (no keys) — only if present
############################################################

- name: Check if role ssh config exists
  stat:
    path: "{{ role_path }}/files/ssh/config"
  register: role_ssh

- name: Install SSH config
  copy:
    src: ssh/config
    dest: "{{ dotfiles_home }}/.ssh/config"
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_user }}"
    mode: "0600"
  when: role_ssh.stat.exists
  become: true

