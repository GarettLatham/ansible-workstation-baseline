# --- Basic tmux baseline ---

# Enable mouse + vi copy mode
set -g mouse on
setw -g mode-keys vi

# Use system clipboard when possible
set -g set-clipboard on

# Wayland clipboard integration (Fedora KDE Wayland)
# (falls back to xclip if wl-copy isn't available)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy || xclip -selection clipboard"

# Optional: easier copy-mode entry
bind-key [ copy-mode -u

# Large scrollback
set -g history-limit 100000

# Improve responsiveness
set -g escape-time 0

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Truecolor (important for Catppuccin)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ",screen-256color:RGB"
set -ga terminal-overrides ",tmux-256color:RGB"

# Status bar refresh
set -g status-interval 5
set -g status-position bottom

# -------------------------
# TPM plugins
# -------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# Catppuccin theme (TPM)
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_pane_status_enabled 'yes'
set -g @catppuccin_status_background 'default'

# (Optional) If you want CPU/Battery modules later, we can add via TPM:
# set -g @plugin 'tmux-plugins/tmux-cpu'
# set -g @plugin 'tmux-plugins/tmux-battery'

# Initialize TPM (KEEP THIS AS THE VERY LAST LINE)
run-shell '~/.tmux/plugins/tpm/tpm'
